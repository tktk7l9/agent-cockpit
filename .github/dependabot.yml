version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # vite 8: electron-vite@5 peer-depends on vite ^5||^6||^7, so bumping
      # to 8 breaks `npm ci` outright. Remove once electron-vite adds vite 8
      # support (and bump @vitejs/plugin-react's major alongside it).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
